<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admissions Funnel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .funnel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 3% 5%;
    }

    .funnel-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.3s ease;
      cursor: pointer;
      color: #ffffff;
      text-align: center;
      border-radius: 6px;
    }

    .funnel-stage:hover {
      filter: brightness(1.08);
    }

    .funnel-stage .stage-label {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.95;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }

    .funnel-stage .stage-actual {
      font-weight: 700;
      line-height: 1.15;
    }

    .funnel-stage .stage-goal {
      opacity: 0.85;
      white-space: nowrap;
    }

    /* Prompt state */
    .prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #999;
      font-size: 14px;
      text-align: center;
      padding: 20px;
      line-height: 1.6;
    }

    .prompt .prompt-icon {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .prompt .prompt-detail {
      font-size: 12px;
      color: #bbb;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="funnel-container" id="funnel-container">
    <div class="prompt" id="prompt">
      <div class="prompt-icon">&#9660;</div>
      <div>Drag fields onto the Marks card to build the funnel</div>
      <div class="prompt-detail">Stage (dimension) &bull; Actual (measure) &bull; Goal (measure)</div>
    </div>
  </div>

  <script src="../lib/tableau.extensions.1.latest.min.js"></script>
  <script>
    'use strict';
    (function () {

      // Stage ordering for the admissions funnel
      var STAGE_ORDER = ['inquiries', 'applications', 'admits', 'commits'];

      // Default configuration
      var config = {
        thresholdRed: 90,
        thresholdGreen: 100,
        colorGreen: '#2e8b57',
        colorAmber: '#d4820f',
        colorRed: '#c0392b',
        funnelColor: '#2c3e50',
        funnelOpacity: 0.7,
        abbreviateNumbers: true,
        showGoals: true,
        tooltipEnabled: true
      };

      var worksheet = null;
      // Store tupleIds per stage for tooltip
      var stageTupleIds = [];

      // --- Number formatting ---
      function formatNumber(val) {
        if (val === null || val === undefined || isNaN(val)) return '\u2014';
        var num = Number(val);
        if (!config.abbreviateNumbers) return num.toLocaleString();
        if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
        if (num >= 10000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
        return num.toLocaleString();
      }

      // --- Color logic ---
      function getColor(actual, goal) {
        if (goal === null || goal === 0 || actual === null) return 'none';
        var pct = (actual / goal) * 100;
        if (pct >= config.thresholdGreen) return 'green';
        if (pct >= config.thresholdRed) return 'amber';
        return 'red';
      }

      function getColorHex(colorName) {
        if (colorName === 'green') return config.colorGreen;
        if (colorName === 'amber') return config.colorAmber;
        if (colorName === 'red') return config.colorRed;
        return 'transparent';
      }

      // --- Compute graduated fill for a stage index ---
      function getStageFill(index, total) {
        // Graduated: top stage is lighter, bottom is more opaque
        var baseOpacity = config.funnelOpacity;
        var minOpacity = Math.max(baseOpacity - 0.3, 0.15);
        var opacityRange = baseOpacity - minOpacity;
        var stageOpacity = minOpacity + (opacityRange * (index / Math.max(total - 1, 1)));
        return hexToRgba(config.funnelColor, stageOpacity);
      }

      function hexToRgba(hex, alpha) {
        var r = parseInt(hex.slice(1, 3), 16);
        var g = parseInt(hex.slice(3, 5), 16);
        var b = parseInt(hex.slice(5, 7), 16);
        return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
      }

      // --- Sort stages by known funnel order ---
      function stageSort(a, b) {
        var aIdx = STAGE_ORDER.indexOf(a.stage.toLowerCase());
        var bIdx = STAGE_ORDER.indexOf(b.stage.toLowerCase());
        if (aIdx === -1 && bIdx === -1) return 0;
        if (aIdx === -1) return 1;
        if (bIdx === -1) return -1;
        return aIdx - bIdx;
      }

      // --- Responsive sizing ---
      function resizeFunnel() {
        var container = document.getElementById('funnel-container');
        var stages = container.querySelectorAll('.funnel-stage');
        if (stages.length === 0) return;

        var w = container.clientWidth;
        var h = container.clientHeight;
        var numStages = stages.length;

        var gapPx = Math.max(4, h * 0.015);
        var availableHeight = h - (gapPx * (numStages - 1));
        var stageHeight = Math.floor(availableHeight / numStages);

        var maxWidth = w * 0.94;
        var minWidth = w * 0.35;
        var widthStep = (maxWidth - minWidth) / Math.max(numStages - 1, 1);

        var baseFontSize = Math.min(w, h);
        var labelSize = Math.max(Math.min(baseFontSize * 0.028, 14), 9);
        var actualSize = Math.max(Math.min(baseFontSize * 0.065, 36), 16);
        var goalSize = Math.max(Math.min(baseFontSize * 0.022, 12), 8);

        var hideGoals = stageHeight < 55;

        stages.forEach(function (stage, i) {
          var stageWidth = maxWidth - (widthStep * i);
          stage.style.width = stageWidth + 'px';
          stage.style.height = stageHeight + 'px';
          stage.style.marginBottom = (i < numStages - 1) ? gapPx + 'px' : '0';

          var labelEl = stage.querySelector('.stage-label');
          var actualEl = stage.querySelector('.stage-actual');
          var goalEl = stage.querySelector('.stage-goal');

          if (labelEl) labelEl.style.fontSize = labelSize + 'px';
          if (actualEl) actualEl.style.fontSize = actualSize + 'px';
          if (goalEl) {
            goalEl.style.fontSize = goalSize + 'px';
            goalEl.style.display = (hideGoals || !config.showGoals) ? 'none' : 'block';
          }
        });
      }

      var resizeObserver = new ResizeObserver(resizeFunnel);
      resizeObserver.observe(document.getElementById('funnel-container'));

      // --- Render funnel ---
      function renderFunnel(stageData) {
        var container = document.getElementById('funnel-container');
        var prompt = document.getElementById('prompt');

        // Clear existing stages
        container.querySelectorAll('.funnel-stage').forEach(function (el) { el.remove(); });

        if (!stageData || stageData.length === 0) {
          prompt.style.display = 'flex';
          return;
        }

        prompt.style.display = 'none';

        stageData.forEach(function (data, idx) {
          var color = getColor(data.actual, data.goal);
          var colorHex = getColorHex(color);
          var el = document.createElement('div');
          el.className = 'funnel-stage';
          el.style.background = getStageFill(idx, stageData.length);
          el.dataset.index = idx;

          // Apply status border + glow
          if (colorHex !== 'transparent') {
            el.style.boxShadow = 'inset 0 0 0 2px ' + colorHex + ', 0 0 6px ' + hexToRgba(colorHex, 0.4);
          } else {
            el.style.boxShadow = 'none';
          }

          var html = '';
          html += '<div class="stage-label">' + escapeHtml(data.stage) + '</div>';
          html += '<div class="stage-actual">' + formatNumber(data.actual) + '</div>';
          if (config.showGoals && data.goal !== null) {
            html += '<div class="stage-goal">Goal: ' + formatNumber(data.goal) + '</div>';
          }

          el.innerHTML = html;

          // Tooltip: native Tableau tooltip via hoverTupleAsync
          el.addEventListener('mousemove', function (e) {
            if (!worksheet || !config.tooltipEnabled) return;
            var stageIdx = parseInt(el.dataset.index);
            var tupleId = stageTupleIds[stageIdx];
            if (tupleId === null || tupleId === undefined) return;
            worksheet.hoverTupleAsync(tupleId, {
              tooltipAnchorPoint: { x: e.pageX, y: e.pageY }
            }).catch(function () {});
          });

          el.addEventListener('mouseleave', function () {
            if (!worksheet || !config.tooltipEnabled) return;
            worksheet.hoverTupleAsync(0, {
              tooltipAnchorPoint: { x: 0, y: 0 }
            }).catch(function () {});
          });

          container.appendChild(el);
        });

        resizeFunnel();
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      // --- Load config from settings ---
      function loadConfig() {
        var s = tableau.extensions.settings;
        var tr = s.get('thresholdRed');
        var tg = s.get('thresholdGreen');
        if (tr) config.thresholdRed = parseFloat(tr);
        if (tg) config.thresholdGreen = parseFloat(tg);

        var cg = s.get('colorGreen');
        var ca = s.get('colorAmber');
        var cr = s.get('colorRed');
        if (cg) config.colorGreen = cg;
        if (ca) config.colorAmber = ca;
        if (cr) config.colorRed = cr;

        var fc = s.get('funnelColor');
        var fo = s.get('funnelOpacity');
        if (fc) config.funnelColor = fc;
        if (fo) config.funnelOpacity = parseFloat(fo);

        config.abbreviateNumbers = s.get('abbreviateNumbers') !== 'false';
        config.showGoals = s.get('showGoals') !== 'false';
        config.tooltipEnabled = s.get('tooltipEnabled') !== 'false';
      }

      // --- Configure dialog ---
      function showConfig() {
        var popupUrl = window.location.href.replace('index.html', 'config.html');
        tableau.extensions.ui.displayDialogAsync(popupUrl, '', { height: 520, width: 400 })
          .then(function () { loadConfig(); updateDataAndRender(); })
          .catch(function (error) {
            if (error.errorCode !== tableau.ErrorCodes.DialogClosedByUser) {
              console.error('[Funnel] Config error:', error);
            }
          });
      }

      // --- Initialize viz extension ---
      window.onload = tableau.extensions.initializeAsync({ configure: showConfig }).then(function () {
        worksheet = tableau.extensions.worksheetContent.worksheet;
        loadConfig();

        worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateDataAndRender);

        tableau.extensions.settings.addEventListener(
          tableau.TableauEventType.SettingsChanged,
          function () { loadConfig(); updateDataAndRender(); }
        );

        updateDataAndRender();
      }, function (err) {
        console.error('[Funnel] Init failed:', err);
        document.getElementById('prompt').innerHTML = '<div>Extension init error</div>';
      });

      // --- Fetch data and render ---
      async function updateDataAndRender() {
        if (!worksheet) return;

        // Get encoding map
        var encodingMap = await getEncodingMap(worksheet);

        if (!encodingMap.stage) {
          stageTupleIds = [];
          renderFunnel([]);
          return;
        }

        // Get the data
        var dataTableReader = await worksheet.getSummaryDataReaderAsync();
        var dataTable = await dataTableReader.getAllPagesAsync();
        await dataTableReader.releaseAsync();

        var columns = dataTable.columns;
        var rows = dataTable.data;

        if (rows.length === 0) {
          stageTupleIds = [];
          renderFunnel([]);
          return;
        }

        // Build column index map
        var colIdx = {};
        columns.forEach(function (col, i) { colIdx[col.fieldName] = i; });

        // Find columns (case-insensitive fallback)
        var stageColIdx = findColIdx(colIdx, encodingMap.stage);
        var actualColIdx = encodingMap.actual ? findColIdx(colIdx, encodingMap.actual) : null;
        var goalColIdx = encodingMap.goal ? findColIdx(colIdx, encodingMap.goal) : null;

        if (stageColIdx === null) {
          stageTupleIds = [];
          renderFunnel([]);
          return;
        }

        // Process rows
        var stageData = [];
        var tupleIds = [];

        for (var r = 0; r < rows.length; r++) {
          var row = rows[r];
          var stageName = row[stageColIdx].formattedValue || row[stageColIdx].value;
          var actual = actualColIdx !== null ? parseFloat(row[actualColIdx].value) : null;
          var goal = goalColIdx !== null ? parseFloat(row[goalColIdx].value) : null;

          if (stageName && stageName !== 'Null' && stageName !== '%null%') {
            stageData.push({
              stage: String(stageName),
              actual: isNaN(actual) ? null : actual,
              goal: isNaN(goal) ? null : goal
            });
            // tupleId is 1-based row index
            tupleIds.push(r + 1);
          }
        }

        // Sort by funnel order
        var sortedIndices = stageData.map(function (d, i) { return i; });
        sortedIndices.sort(function (a, b) { return stageSort(stageData[a], stageData[b]); });

        var sortedData = sortedIndices.map(function (i) { return stageData[i]; });
        stageTupleIds = sortedIndices.map(function (i) { return tupleIds[i]; });

        renderFunnel(sortedData);
      }

      function findColIdx(colIdx, fieldName) {
        if (colIdx[fieldName] !== undefined) return colIdx[fieldName];
        var upper = fieldName.toUpperCase();
        for (var key in colIdx) {
          if (key.toUpperCase() === upper) return colIdx[key];
        }
        return null;
      }

      // --- Get encoding map from visual specification ---
      async function getEncodingMap(ws) {
        var map = { stage: null, actual: null, goal: null };
        try {
          var visualSpec = await ws.getVisualSpecificationAsync();
          var marksCard = visualSpec.marksSpecifications[visualSpec.activeMarksSpecificationIndex];
          for (var i = 0; i < marksCard.encodings.length; i++) {
            var enc = marksCard.encodings[i];
            if (enc.id === 'stage' && enc.field) map.stage = enc.field.name;
            else if (enc.id === 'actual' && enc.field) map.actual = enc.field.name;
            else if (enc.id === 'goal' && enc.field) map.goal = enc.field.name;
          }
        } catch (e) {
          console.error('[Funnel] Error reading encodings:', e);
        }
        return map;
      }
    })();
  </script>
</body>
</html>
